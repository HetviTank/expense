{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<canvas id="categoryChart" width="400" height="200"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('categoryChart').getContext('2d'); // ✅ get 2d context
new Chart(ctx, {
    type: 'pie',
    data: {
        labels: {{ categories.keys() | list | safe }},
        datasets: [{
            label: 'Expenses by Category',
            data: {{ categories.values() | list | safe }},
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                position: 'top',
            },
            title: {
                display: true,
                text: 'Expenses by Category'
            }
        }
    }
});
</script>
{% endblock %}
