{% extends "base.html" %}
{% block content %}
<h2>Add New Expense</h2>
<form method="post" action="/expenses/add" enctype="multipart/form-data">
    <label for="amount">Amount (₹)</label>
    <input id="amount" name="amount" type="number" step="0.01" placeholder="Enter amount" required>
    
    <label for="category">Category</label>
    <select id="category" name="category" required>
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Transportation">Transportation</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Healthcare">Healthcare</option>
        <option value="Other">Other</option>
    </select>
    
    <label for="date">Date</label>
    <input id="date" name="date" type="date" required>
    
    <label for="description">Description (Optional)</label>
    <textarea id="description" name="description" placeholder="Add description..."></textarea>
    
    <label for="bill">Receipt/Bill (Optional)</label>
    <input id="bill" type="file" name="bill" accept=".jpg,.jpeg,.png,.pdf">
    
    <button type="submit">Add Expense</button>
</form>
{% endblock %}
